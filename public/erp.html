function renderReorder(){
  // Step 1: Pending orders ke order_no1 list banao (PMS se, COMPLETE chhod ke)
  var pendingOrderNos = {};
  DB.pms.forEach(function(p){
    if(p.status !== 'COMPLETE') pendingOrderNos[p.order_no1] = true;
  });

  // Step 2: yarnWeight me se sirf pending orders ke records lo
  // feeder yarn naam → { totalGm (sum of f.total across all matching orders), orders[] }
  var yarnMap = {}; // key = feeder yarn name (exact), value = { totalGm, orders[] }

  DB.yarnWeight.forEach(function(yw){
    // Is order ka koi bhi PMS record pending hai?
    if(!pendingOrderNos[yw.order_no1]) return;

    var feeders = [yw.f1,yw.f2,yw.f3,yw.f4,yw.f5,yw.f6,yw.f7,yw.f8].filter(Boolean);
    feeders.forEach(function(f){
      if(!f.yarn || !f.yarn.trim()) return;
      var key = f.yarn.trim();
      // f.total = gm_saree * qty (already calculated, in grams)
      var gmValue = f.total || ((f.gm_saree||0) * (yw.qty||0));
      if(!yarnMap[key]) yarnMap[key] = { totalGm: 0, orders: [] };
      yarnMap[key].totalGm += gmValue;
      yarnMap[key].orders.push({
        order_no1: yw.order_no1,
        qty: yw.qty||0,
        gm_saree: f.gm_saree||0,
        feeder_total: gmValue
      });
    });
  });

  // Step 3: Stock ke saath merge
  var allItems = DB.stock.map(function(s){
    var match = yarnMap[s.item]; // exact name match
    var reqGm  = match ? match.totalGm : 0;
    var reqKG  = reqGm / 1000;
    var balance = s.closing - reqKG;
    var orders  = match ? match.orders : [];

    var balStatus;
    if(reqKG === 0)         balStatus = 'NO REQ';
    else if(balance >= 0)   balStatus = 'SUFFICIENT';
    else if(balance >= -50) balStatus = 'SHORT';
    else                    balStatus = 'CRITICAL';

    return {
      item: s.item, category: s.category,
      closing: s.closing, status: s.status,
      reqKG: reqKG, balance: balance,
      balStatus: balStatus, orders: orders
    };
  });

  var actionItems = allItems.filter(function(s){ return s.reqKG > 0 || s.status !== 'OK'; });
  var okItems     = allItems.filter(function(s){ return s.reqKG === 0 && s.status === 'OK'; });

  function balBadge(st){
    if(st==='NO REQ')      return '<span class="badge" style="background:rgba(100,116,139,0.2);color:#94a3b8">No Req.</span>';
    if(st==='SUFFICIENT')  return '<span class="badge badge-green">Sufficient</span>';
    if(st==='SHORT')       return '<span class="badge badge-amber">Short</span>';
    return '<span class="badge" style="background:rgba(248,113,113,0.18);color:#f87171;border:1px solid rgba(248,113,113,0.4)">Critical</span>';
  }

  var pendingCount = Object.keys(pendingOrderNos).length;
  var critCount  = allItems.filter(function(x){ return x.balStatus==='CRITICAL'; }).length;
  var shortCount = allItems.filter(function(x){ return x.balStatus==='SHORT'; }).length;
  var sufCount   = allItems.filter(function(x){ return x.balStatus==='SUFFICIENT'; }).length;
  var noReqCount = allItems.filter(function(x){ return x.balStatus==='NO REQ'; }).length;

  // Build action rows
  var actionRowsHtml = actionItems.map(function(s){
    var orderDetail = '';
    if(s.orders.length > 0){
      var parts = s.orders.map(function(o){
        return '<span style="white-space:nowrap">' + o.order_no1 + ': <strong>' + (o.feeder_total/1000).toFixed(3) + ' KG</strong></span>';
      });
      orderDetail = '<div style="font-size:0.69rem;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px">' + parts.join('<span style="color:var(--border)"> | </span>') + '</div>';
    }
    var balColor   = s.balance < 0 ? '#f87171' : s.reqKG === 0 ? '#94a3b8' : '#4ade80';
    var reqDisplay = s.reqKG > 0 ? s.reqKG.toFixed(3) : '—';
    var balDisplay = s.reqKG > 0 ? s.balance.toFixed(3) : '—';
    return '<tr>'
      + '<td><strong>' + s.item + '</strong>' + orderDetail + '</td>'
      + '<td class="muted">' + s.category + '</td>'
      + '<td style="text-align:right;font-weight:700">' + s.closing.toFixed(2) + '</td>'
      + '<td style="text-align:right;color:#fbbf24;font-weight:700">' + reqDisplay + '</td>'
      + '<td style="text-align:right;font-weight:700;color:' + balColor + '">' + balDisplay + '</td>'
      + '<td>' + balBadge(s.balStatus) + '</td>'
      + '<td><button class="btn btn-primary btn-sm" onclick="goToPO(\'' + s.item + '\')">📋 PO</button></td>'
      + '</tr>';
  }).join('');

  var okRowsHtml = okItems.map(function(s){
    return '<tr>'
      + '<td><strong>' + s.item + '</strong></td>'
      + '<td class="muted">' + s.category + '</td>'
      + '<td style="text-align:right">' + s.closing.toFixed(2) + '</td>'
      + '<td>' + stockBadge(s.status) + '</td>'
      + '</tr>';
  }).join('');

  var okPanel = okItems.length > 0
    ? '<div class="panel" style="padding:0;overflow:hidden">'
      + '<div style="padding:14px 18px 10px;font-size:0.82rem;font-weight:700;color:#4ade80;border-bottom:1px solid var(--border)">OK Stock — No Pending Requirement</div>'
      + '<div class="table-wrap"><table>'
      + '<thead><tr><th>Yarn Item</th><th>Category</th><th style="text-align:right">Closing (KG)</th><th>Stock Status</th></tr></thead>'
      + '<tbody>' + okRowsHtml + '</tbody>'
      + '</table></div></div>'
    : '';

  return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">' + backBtn() + '</div>'
  + '<div class="page-header">'
    + '<div class="page-title">Reorder Sheet</div>'
    + '<div style="font-size:0.8rem;color:var(--muted)">Pending Orders: <strong style="color:var(--teal)">' + pendingCount + '</strong> &nbsp;|&nbsp; Yarn items tracked: <strong style="color:var(--teal)">' + Object.keys(yarnMap).length + '</strong></div>'
    + '</div>'
    + '<div class="stats-row">'
    + '<div class="stat" style="--stat-col:#f87171"><div class="stat-label">Critical</div><div class="stat-val">' + critCount + '</div></div>'
    + '<div class="stat" style="--stat-col:#fbbf24"><div class="stat-label">Short</div><div class="stat-val">' + shortCount + '</div></div>'
    + '<div class="stat" style="--stat-col:#4ade80"><div class="stat-label">Sufficient</div><div class="stat-val">' + sufCount + '</div></div>'
    + '<div class="stat" style="--stat-col:#94a3b8"><div class="stat-label">No Req.</div><div class="stat-val">' + noReqCount + '</div></div>'
    + '</div>'
    + '<div class="panel" style="padding:0;overflow:hidden">'
    + '<div style="padding:14px 18px 10px;font-size:0.82rem;font-weight:700;color:var(--teal);border-bottom:1px solid var(--border)">Pending Orders — Yarn Required vs Closing Stock</div>'
    + '<div class="table-wrap"><table>'
    + '<thead><tr>'
    + '<th>Yarn Item</th>'
    + '<th>Category</th>'
    + '<th style="text-align:right">Closing Stock (KG)</th>'
    + '<th style="text-align:right">Required — Pending (KG)</th>'
    + '<th style="text-align:right">Balance (KG)</th>'
    + '<th>Balance Status</th>'
    + '<th>Action</th>'
    + '</tr></thead>'
    + '<tbody>' + actionRowsHtml + '</tbody>'
    + '</table></div></div>'
    + okPanel
    + '<div style="margin-top:14px;padding:12px;background:rgba(14,165,233,0.06);border:1px solid rgba(14,165,233,0.18);border-radius:10px;font-size:0.79rem;color:var(--muted)">'
    + '💡 <strong style="color:var(--teal)">Balance = Closing Stock − Total Required (Pending Orders)</strong> &nbsp;|&nbsp; '
    + 'Required column: feeder yarn name stock item se exact match hota hai &nbsp;|&nbsp; '
    + '<span style="color:#4ade80">Sufficient</span>: balance ≥ 0 &nbsp;|&nbsp; '
    + '<span style="color:#fbbf24">Short</span>: 0 to −50 KG &nbsp;|&nbsp; '
    + '<span style="color:#f87171">Critical</span>: −50 KG se zyada'
    + '</div>';
}

function goToPO(item){
  openModule('po');
  setTimeout(()=>{
    const sel=document.getElementById('po_item');
    if(sel) for(let o of sel.options) if(o.text===item){o.selected=true;break;}
    showToast(`📋 PO create karo: ${item}`);
  },200);
}

function poListFilter(){
  const q=(document.getElementById('poSearch')?.value||'').toLowerCase();
  const st=document.getElementById('poSt')?.value||'ALL';
  const sup=document.getElementById('poSup')?.value||'ALL SUPPLIERS';
  const filtered=DB.po.filter(p=>{
    const mq=!q||p.voucher.toLowerCase().includes(q)||p.supplier.toLowerCase().includes(q)||p.item.toLowerCase().includes(q);
    const ms=st==='ALL'||p.status===st;
    const msup=sup==='ALL SUPPLIERS'||p.supplier===sup;
    return mq&&ms&&msup;
  });
  const el=document.getElementById('poTbl');
  if(el) el.innerHTML=filtered.map(p=>`<tr>
    <td><strong>${p.voucher}</strong></td><td class="muted">${p.date}</td>
    <td>${p.supplier}</td><td>${p.item}</td>
    <td><strong>${p.qty}</strong></td><td class="muted">${p.due}</td>

function renderPendingPO(){
  const pend=DB.po.filter(p=>p.status==='PENDING');

  return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">${backBtn()}</div>

    return`<tr><td><strong>${p.voucher}</strong></td><td>${p.supplier}</td><td>${p.item}</td>
      <td>${p.qty} ${p.unit}</td><td class="muted">${p.due}</td>

  const pendingOrders=DB.orders.filter(o=>o.status!=='COMPLETE'||true);

      <input class="form-control" id="pay_balance" readonly style="color:#fbbf24"></div>

      <select class="form-control" id="pay_mode">
        <option>RTGS</option><option>NEFT</option><option>Cheque</option><option>Cash</option><option>UPI</option>
      </select>
    </div>
    <div class="form-group" style="margin-bottom:12px"><label>Reference / Cheque No</label>
      <input class="form-control" id="pay_ref" placeholder="TXN / Cheque no."></div>
    <div class="form-group" style="margin-bottom:14px"><label>Notes</label>
      <input class="form-control" id="pay_note" placeholder="Optional note"></div>
    <button class="btn btn-primary" onclick="savePayment()">✅ Save Payment</button>
  </div>
  <div>
    <div class="panel-title" style="color:var(--teal);font-family:var(--font-head);font-size:0.95rem;margin-bottom:12px">📋 Pending Orders (Payment Baki)</div>
    <div class="panel" style="padding:0"><div class="table-wrap"><table>
      <thead><tr><th>Order No</th><th>Party</th><th>Order Value</th><th>Received</th><th>Balance</th><th>Status</th></tr></thead>
      <tbody>${DB.orders.map(o=>{
        const total=o.qty*o.rate;
        const received=DB.payments.filter(p=>p.order_no===o.order_no).reduce((s,p)=>s+p.amount,0);
        const bal=total-received;
        return `<tr>
          <td><strong>${o.order_no}</strong></td><td class="muted">${o.party}</td>
          <td>₹${total.toLocaleString()}</td>
          <td style="color:#4ade80">₹${received.toLocaleString()}</td>
          <td style="color:${bal>0?'#f87171':'#4ade80'};font-weight:700">₹${bal.toLocaleString()}</td>
          <td>${bal<=0?'<span class="badge badge-green">PAID</span>':received>0?'<span class="badge badge-amber">PARTIAL</span>':'<span class="badge badge-red">PENDING</span>'}</td>
        </tr>`;}).join('')}
      </tbody>
    </table></div></div>
  </div>
  </div>`;
}

function fillPayParty(){
  const sel=document.getElementById('pay_order');
  const opt=sel.options[sel.selectedIndex];
  document.getElementById('pay_party').value=opt.dataset.party||'';
  document.getElementById('pay_total').value=opt.dataset.amt?'₹'+parseInt(opt.dataset.amt).toLocaleString():'';
  calcPayBalance();
}

function calcPayBalance(){
  const total=parseInt((document.getElementById('pay_total')?.value||'0').replace(/[^0-9]/g,''))||0;
  const recv=parseInt(document.getElementById('pay_amount')?.value)||0;
  const bal=total-recv;
  const el=document.getElementById('pay_balance');
  if(el){el.value='₹'+bal.toLocaleString(); el.style.color=bal>0?'#fbbf24':'#4ade80';}
}

function savePayment(){
  const on=document.getElementById('pay_order')?.value;
  if(!on){showToast('⚠️ Order select karo',true);return;}
  const amt=parseInt(document.getElementById('pay_amount')?.value)||0;
  if(!amt){showToast('⚠️ Amount dalo',true);return;}
  const p={id:DB.payments.length+1,order_no:on,party:document.getElementById('pay_party')?.value||'',
    date:document.getElementById('pay_date')?.value,amount:amt,
    mode:document.getElementById('pay_mode')?.value,
    ref:document.getElementById('pay_ref')?.value,
    note:document.getElementById('pay_note')?.value};
  DB.payments.push(p);
  showToast('✅ Payment saved!'); autoSync(); showPage('pay-entry');
}

  return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">${backBtn()}</div>

    </tr>`).join('')}
    ${DB.payments.length===0?'<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:20px">Koi payment record nahi hai</td></tr>':''}
    </tbody>
  </table></div></div>`;

      ${d.rate?`<div style="font-size:0.7rem;color:#fbbf24">₹${d.rate}</div>`:''}
      ${d.remarks?`<div style="font-size:0.68rem;color:#94a3b8;margin-top:2px">${d.remarks}</div>`:''}
      <button class="btn btn-outline btn-sm" style="margin-top:8px;width:100%" onclick="event.stopPropagation();uploadDesignImg('${d.design_no}')">📷 Image</button>
    </div>`).join('')}
  </div>`;
}
function designLibFilter(){
  const q=(document.getElementById('designSearch')?.value||'').toLowerCase();
  const typeF=(document.getElementById('designTypeFilter')?.value||'ALL');
  let arr=DB.designs.filter(d=>!q||d.design_no.toLowerCase().includes(q)||(d.quality||'').toLowerCase().includes(q));
  if(typeF!=='ALL') arr=arr.filter(d=>(d.design_type||'other')===typeF);
  const grid=document.getElementById('designGrid');
  if(!grid) return;
  const typeBadge=(t)=>{if(t==='new')return'<span class="badge badge-green" style="font-size:0.6rem">✨ NEW</span>';if(t==='change')return'<span class="badge badge-amber" style="font-size:0.6rem">🔄 CHANGE</span>';if(t==='purchase')return'<span class="badge badge-teal" style="font-size:0.6rem">🛒 PURCHASE</span>';return'';};
  grid.innerHTML=arr.map(d=>`<div class="panel" style="padding:14px;text-align:center;cursor:pointer" onclick="showDesignDetail('${d.design_no}')">
    <div style="margin-bottom:6px">${typeBadge(d.design_type)}</div>
    ${d.image?`<img src="${d.image}" style="width:100%;height:120px;object-fit:cover;border-radius:8px;margin-bottom:8px">`:`<div style="width:100%;height:120px;background:rgba(14,165,233,0.06);border:2px dashed rgba(14,165,233,0.2);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:0.8rem;margin-bottom:8px">No Image</div>`}
    <div style="font-family:var(--font-head);font-size:1rem;font-weight:700;color:var(--teal)">${d.design_no}</div>
    <div style="font-size:0.72rem;color:var(--muted);margin-top:3px">${d.quality||d.notes||''}</div>
    ${d.rate?`<div style="font-size:0.7rem;color:#fbbf24">₹${d.rate}</div>`:''}
    <button class="btn btn-outline btn-sm" style="margin-top:8px;width:100%" onclick="event.stopPropagation();uploadDesignImg('${d.design_no}')">📷 Image</button>
  </div>`).join('')||'<div class="panel" style="grid-column:1/-1"><p style="color:var(--muted)">Koi design nahi</p></div>';
}

function showDesignDetail(designNo){
  const d=DB.designs.find(x=>x.design_no===designNo); if(!d) return;
  const orders=DB.orders.filter(o=>o.design_no===designNo);
  document.getElementById('modalTitle').textContent=`Design: ${designNo}`;
  document.getElementById('modalSave').style.display='none';
  document.getElementById('modalBody').innerHTML=`
  <div style="text-align:center;margin-bottom:14px">
    ${d.image?`<img src="${d.image}" style="max-width:100%;max-height:220px;object-fit:contain;border-radius:8px">`:
      `<div style="height:120px;background:rgba(14,165,233,0.06);border:2px dashed rgba(14,165,233,0.2);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted)">No Image — Upload karo</div>`}
  </div>
  <div style="margin-bottom:10px"><strong>Notes:</strong> ${d.notes||'-'}</div>
  <div style="font-size:0.85rem;color:var(--teal);margin-bottom:6px">Is Design ke Orders:</div>
  ${orders.length===0?'<p style="color:var(--muted)">Koi order nahi</p>':
    orders.map(o=>`<div style="background:rgba(255,255,255,0.04);border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:0.82rem">
      <strong>${o.order_no}</strong> — ${o.party} — ${o.qty} Saree — ${sBadge(o.status)}
    </div>`).join('')}
  <div style="margin-top:12px">
    <button class="btn btn-outline btn-sm" onclick="uploadDesignImg('${designNo}')">📷 Upload Image</button>
  </div>`;
  openModal();
}

function uploadDesignImg(designNo){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.onchange=e=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const d=DB.designs.find(x=>x.design_no===designNo);
      if(d) d.image=ev.target.result;
      else DB.designs.push({design_no:designNo,image:ev.target.result,notes:''});
      showToast('✅ Image uploaded!'); autoSync();
      closeModal(); showPage('design-lib');
    };
    reader.readAsDataURL(file);
  };
  inp.click();
}

function renderDesignAdd(){
  return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">${backBtn()}</div>
  <div class="page-header"><div class="page-title">Add Design</div></div>
  <div class="panel" style="max-width:480px">
    <div class="panel-title">New Design Entry</div>
    <div class="form-group" style="margin-bottom:12px"><label>Design No</label>
      <input class="form-control" id="da_dn" placeholder="SID-XXXX or ANS-XXXX"></div>
    <div class="form-group" style="margin-bottom:12px"><label>Notes / Jari</label>
      <input class="form-control" id="da_note" placeholder="150 LICHI/WHITE BEAM etc."></div>
    <div class="form-group" style="margin-bottom:14px"><label>Design Image (optional)</label>
      <input type="file" id="da_img" accept="image/*" class="form-control" style="padding:6px"></div>
    <button class="btn btn-primary" onclick="saveDesign()">✅ Save Design</button>
  </div>`;
}

function saveDesign(){
  const dn=document.getElementById('da_dn')?.value.trim();
  if(!dn){showToast('⚠️ Design no. dalo',true);return;}
  if(DB.designs.find(d=>d.design_no===dn)){showToast('⚠️ Ye design already hai',true);return;}
  const file=document.getElementById('da_img')?.files[0];
  if(file){
    const r=new FileReader();
    r.onload=ev=>{DB.designs.push({design_no:dn,image:ev.target.result,notes:document.getElementById('da_note')?.value||''});showToast('✅ Design saved!');autoSync();showPage('design-lib');};
    r.readAsDataURL(file);
  } else {
    DB.designs.push({design_no:dn,image:'',notes:document.getElementById('da_note')?.value||''});
    showToast('✅ Design saved!'); autoSync(); showPage('design-lib');
  }
}

</script>


<script>

}

// ── 1. ORDER REPORT ──

    + '<div class="stat" style="--stat-col:#4ade80"><div class="stat-label">Complete</div><div class="stat-val">' + complete + '</div></div>'
    + '<div class="stat" style="--stat-col:#c084fc"><div class="stat-label">Total Qty</div><div class="stat-val">' + totalQty + '</div></div>'

function rptOrdersFilter() {

function printRptOrders() {

    var val = (o.qty||0)*(o.rate||0);

// ── 2. PRODUCTION REPORT (PMS) ──
function renderRptProduction() {
  var pms = DB.pms.slice();

      + '<td>' + p.party + '</td>'

    + '<div class="stat" style="--stat-col:#4ade80"><div class="stat-label">Complete</div><div class="stat-val">' + complete + '</div></div>'

  var rows = DB.pms.map(function(p){
    var rptDone = p.rpt_done||0;

  printReport('Production Report', tbl);
}

// ── 3. STOCK REPORT ──
function renderRptStock() {
  var stock = DB.stock.slice();
  var noStock  = stock.filter(function(s){ return s.status==='No Stock'; }).length;
  var lowStock = stock.filter(function(s){ return s.status==='Low Stock'; }).length;
  var ok       = stock.filter(function(s){ return s.status==='OK'; }).length;
  var totalKg  = stock.reduce(function(s,x){ return s+(x.closing||0); },0);

  // Group by category
  var categories = {};
  stock.forEach(function(s){
    if(!categories[s.category]) categories[s.category] = [];
    categories[s.category].push(s);
  });

  var rows = stock.map(function(s){

// ── 7. YARN USAGE REPORT ──
function renderRptYarn() {
  var yw = DB.yarnWeight || [];

  // Yarn item → total usage across all orders
  var yarnUsage = {};
  yw.forEach(function(entry){
    var feeders = [entry.f1,entry.f2,entry.f3,entry.f4,entry.f5,entry.f6,entry.f7,entry.f8].filter(Boolean);
    feeders.forEach(function(f){
      if(!f.yarn) return;
      if(!yarnUsage[f.yarn]) yarnUsage[f.yarn] = { totalGm:0, orders:0, avgGmSaree:0, sumGmSaree:0, count:0 };
      yarnUsage[f.yarn].totalGm    += (f.total||0);
      yarnUsage[f.yarn].sumGmSaree += (f.gm_saree||0);
      yarnUsage[f.yarn].count      += 1;
      yarnUsage[f.yarn].orders     += 1;
    });
  });

  Object.keys(yarnUsage).forEach(function(k){
    var u = yarnUsage[k];
    u.avgGmSaree = u.count > 0 ? u.sumGmSaree/u.count : 0;
  });

  var usageRows = Object.keys(yarnUsage).map(function(yarn){
    var u = yarnUsage[yarn];
    var stock = DB.stock.find(function(s){ return s.item===yarn; });
    var closing = stock ? stock.closing : null;
    var stockCell = closing !== null
      ? closing.toFixed(2) + ' KG &nbsp;' + stockBadge(stock.status)
      : '<span style="color:var(--muted)">—</span>';
    return '<tr>'
      + '<td><strong>' + yarn + '</strong></td>'
      + '<td style="text-align:right;font-weight:700">' + u.totalGm.toFixed(3) + ' Gm</td>'
      + '<td style="text-align:right">' + (u.totalGm/1000).toFixed(3) + ' KG</td>'
      + '<td style="text-align:right">' + u.avgGmSaree.toFixed(3) + ' Gm</td>'
      + '<td style="text-align:right">' + u.orders + '</td>'
      + '<td>' + stockCell + '</td>'
      + '</tr>';
  }).join('');

  return '<div class="page-header">'
    + '<div class="page-title">Yarn Usage Report</div>'
    + '<button class="btn btn-outline btn-sm" onclick="printRptYarn()">🖨️ Print</button>'
    + '</div>'
    + '<div class="stats-row">'
    + '<div class="stat" style="--stat-col:#38bdf8"><div class="stat-label">Yarn Types</div><div class="stat-val">'+Object.keys(yarnUsage).length+'</div></div>'
    + '<div class="stat" style="--stat-col:#c084fc"><div class="stat-label">Orders Tracked</div><div class="stat-val">'+yw.length+'</div></div>'
    + '</div>'
    + '<div class="panel" style="padding:0"><div class="table-wrap"><table>'
    + '<thead><tr><th>Yarn Item</th><th style="text-align:right">Total Usage (Gm)</th><th style="text-align:right">Total Usage (KG)</th><th style="text-align:right">Avg Gm/Saree</th><th style="text-align:right">Orders</th><th>Current Stock</th></tr></thead>'
    + '<tbody>' + usageRows + '</tbody>'
    + '</table></div></div>';
}

function printRptYarn() {
  var yw = DB.yarnWeight||[];
  var yarnUsage = {};
  yw.forEach(function(entry){
    var feeders = [entry.f1,entry.f2,entry.f3,entry.f4,entry.f5,entry.f6,entry.f7,entry.f8].filter(Boolean);
    feeders.forEach(function(f){
      if(!f.yarn) return;
      if(!yarnUsage[f.yarn]) yarnUsage[f.yarn]={totalGm:0,orders:0};
      yarnUsage[f.yarn].totalGm+=(f.total||0);
      yarnUsage[f.yarn].orders+=1;
    });
  });
  var rows = Object.keys(yarnUsage).map(function(y){
    var u=yarnUsage[y]; return '<tr><td>'+y+'</td><td style="text-align:right">'+u.totalGm.toFixed(3)+' Gm</td><td style="text-align:right">'+(u.totalGm/1000).toFixed(3)+' KG</td><td>'+u.orders+'</td></tr>';
  }).join('');
  var tbl = '<table><thead><tr><th>Yarn Item</th><th style="text-align:right">Total (Gm)</th><th style="text-align:right">Total (KG)</th><th>Orders</th></tr></thead><tbody>'+rows+'</tbody></table>';
  printReport('Yarn Usage Report', tbl);
}

// ── 8. SUMMARY REPORT ──
function renderRptSummary() {
  var today = new Date().toLocaleDateString('en-IN');
  var orders = DB.orders;
  var pms    = DB.pms;
  var pays   = DB.payments||[];
  var stock  = DB.stock;
  var po     = DB.po||[];

  var totalOrderVal  = orders.reduce(function(s,o){ return s+(o.qty||0)*(o.rate||0); },0);
  var totalPaid      = pays.reduce(function(s,p){ return s+(p.amount||0); },0);
  var totalBalance   = totalOrderVal - totalPaid;
  var pendingOrders  = orders.filter(function(o){ return o.status!=='COMPLETE'; }).length;
  var completedOrders= orders.filter(function(o){ return o.status==='COMPLETE'; }).length;
  var pendingPMS     = pms.filter(function(p){ return p.status!=='COMPLETE'; }).length;
  var completedPMS   = pms.filter(function(p){ return p.status==='COMPLETE'; }).length;
  var lowStock       = stock.filter(function(s){ return s.status!=='OK'; }).length;
  var pendingPO      = po.filter(function(p){ return p.status==='PENDING'; }).length;

  // Agent wise order value
  var agentMap = {};
  orders.forEach(function(o){
    agentMap[o.agent]=(agentMap[o.agent]||0)+(o.qty||0)*(o.rate||0);
  });

  // Party wise outstanding
  var partyMap = {};
  orders.forEach(function(o){
    var v=(o.qty||0)*(o.rate||0);
    partyMap[o.party]=(partyMap[o.party]||{val:0,paid:0});
    partyMap[o.party].val+=v;
  });
  pays.forEach(function(p){
    if(partyMap[p.party]) partyMap[p.party].paid+=(p.amount||0);
    else partyMap[p.party]={val:0,paid:(p.amount||0)};
  });

  var agentRows = Object.keys(agentMap).map(function(a){
    var aOrders = orders.filter(function(o){ return o.agent===a; });
    return '<tr><td><strong>'+a+'</strong></td><td>'+aOrders.length+'</td><td style="color:#4ade80;font-weight:700">₹'+agentMap[a].toLocaleString()+'</td></tr>';
  }).join('');

  var partyRows = Object.keys(partyMap).sort(function(a,b){
    return (partyMap[b].val-partyMap[b].paid)-(partyMap[a].val-partyMap[a].paid);
  }).slice(0,10).map(function(p){
    var pm=partyMap[p];
    var bal=pm.val-pm.paid;
    var color=bal>0?'#f87171':'#4ade80';
    return '<tr><td><strong>'+p+'</strong></td><td style="color:#4ade80">₹'+pm.val.toLocaleString()+'</td><td style="color:#38bdf8">₹'+pm.paid.toLocaleString()+'</td><td style="color:'+color+';font-weight:700">₹'+Math.abs(bal).toLocaleString()+'</td></tr>';
  }).join('');

  return '<div class="page-header">'
    + '<div class="page-title">Business Summary</div>'
    + '<div style="font-size:0.8rem;color:var(--muted)">As of ' + today + '</div>'
    + '<button class="btn btn-outline btn-sm" onclick="printRptSummary()">🖨️ Print</button>'
    + '</div>'

    + '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px">'

    + '<div class="panel" style="padding:16px">'
    + '<div style="font-size:0.75rem;color:var(--muted);font-weight:700;letter-spacing:1px;margin-bottom:10px">📋 ORDERS</div>'
    + '<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:var(--muted)">Total</span><strong>'+orders.length+'</strong></div>'
    + '<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:var(--muted)">Pending</span><span style="color:#fbbf24;font-weight:700">'+pendingOrders+'</span></div>'
    + '<div style="display:flex;justify-content:space-between;margin-bottom:10px"><span style="color:var(--muted)">Complete</span><span style="color:#4ade80;font-weight:700">'+completedOrders+'</span></div>'
    + '<div style="border-top:1px solid var(--border);padding-top:10px"><div style="font-size:0.72rem;color:var(--muted)">Total Value</div><div style="font-size:1.3rem;font-weight:800;color:#4ade80">₹'+totalOrderVal.toLocaleString()+'</div></div>'
    + '</div>'

    + '<div class="panel" style="padding:16px">'
    + '<div style="font-size:0.75rem;color:var(--muted);font-weight:700;letter-spacing:1px;margin-bottom:10px">💰 PAYMENTS</div>'
    + '<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:var(--muted)">Total Received</span><span style="color:#4ade80;font-weight:700">₹'+totalPaid.toLocaleString()+'</span></div>'
    + '<div style="display:flex;justify-content:space-between;margin-bottom:10px"><span style="color:var(--muted)">Transactions</span><strong>'+pays.length+'</strong></div>'
    + '<div style="border-top:1px solid var(--border);padding-top:10px"><div style="font-size:0.72rem;color:var(--muted)">Outstanding Balance</div><div style="font-size:1.3rem;font-weight:800;color:#f87171">₹'+totalBalance.toLocaleString()+'</div></div>'
    + '</div>'

    + '<div class="panel" style="padding:16px">'
    + '<div style="font-size:0.75rem;color:var(--muted);font-weight:700;letter-spacing:1px;margin-bottom:10px">⚙️ PRODUCTION</div>'
    + '<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:var(--muted)">Total Programs</span><strong>'+pms.length+'</strong></div>'
    + '<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:var(--muted)">Pending</span><span style="color:#fbbf24;font-weight:700">'+pendingPMS+'</span></div>'
    + '<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:var(--muted)">Complete</span><span style="color:#4ade80;font-weight:700">'+completedPMS+'</span></div>'
    + '<div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Low/No Stock</span><span style="color:#f87171;font-weight:700">'+lowStock+'</span></div>'
    + '</div>'
    + '</div>'

    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">'
    + '<div class="panel" style="padding:0;overflow:hidden">'
    + '<div style="padding:12px 18px 8px;font-weight:700;color:var(--teal);border-bottom:1px solid var(--border)">🏢 Agent-wise Order Value</div>'
    + '<div class="table-wrap"><table><thead><tr><th>Agent</th><th>Orders</th><th>Total Value</th></tr></thead><tbody>'+agentRows+'</tbody></table></div>'
    + '</div>'
    + '<div class="panel" style="padding:0;overflow:hidden">'
    + '<div style="padding:12px 18px 8px;font-weight:700;color:var(--teal);border-bottom:1px solid var(--border)">🏢 Party Outstanding (Top 10)</div>'
    + '<div class="table-wrap"><table><thead><tr><th>Party</th><th>Order Value</th><th>Paid</th><th>Balance</th></tr></thead><tbody>'+partyRows+'</tbody></table></div>'
    + '</div>'
    + '</div>';
}

function printRptSummary() {
  var orders=DB.orders, pays=DB.payments||[], pms=DB.pms;
  var totalVal=orders.reduce(function(s,o){return s+(o.qty||0)*(o.rate||0);},0);
  var totalPaid=pays.reduce(function(s,p){return s+(p.amount||0);},0);
  var tbl = '<table style="margin-bottom:20px"><thead><tr><th>Metric</th><th>Value</th></tr></thead><tbody>'
    + '<tr><td>Total Orders</td><td>'+orders.length+'</td></tr>'
    + '<tr><td>Total Order Value</td><td>₹'+totalVal.toLocaleString()+'</td></tr>'
    + '<tr><td>Total Paid</td><td>₹'+totalPaid.toLocaleString()+'</td></tr>'

  printReport('Business Summary Report', tbl);
}

function fmsChkChange(){
  const chks=document.querySelectorAll('.fms-chk:checked');
  const all=document.querySelectorAll('.fms-chk');
  const el=document.getElementById('fmsSelCount');
  if(el) el.textContent=chks.length>0?`${chks.length} selected`:'';
  const allChk=document.getElementById('fmsChkAll');
  if(allChk) allChk.checked=chks.length===all.length&&all.length>0;
}
function fmsToggleAll(checked){
  document.querySelectorAll('.fms-chk').forEach(c=>c.checked=checked);
  fmsChkChange();
}
function fmsSelectAll(){ fmsToggleAll(true); }
function fmsClearSel(){ fmsToggleAll(false); }
function fmsDeleteSelected(){
  const ids=[...document.querySelectorAll('.fms-chk:checked')].map(c=>parseInt(c.dataset.id));

// ════ DATALIST SEARCHABLE DROPDOWNS ════
// Converts all <select> elements to <input list="..."> for search+select
function makeSearchable(selectId, datalistId){
  const sel=document.getElementById(selectId);
  if(!sel||sel.tagName!=='SELECT') return;
  const val=sel.value;
  const opts=[...sel.options].map(o=>`<option value="${o.value||o.text}">${o.text}</option>`).join('');
  const dl=document.createElement('datalist');
  dl.id=datalistId;
  dl.innerHTML=opts;
  const inp=document.createElement('input');
  inp.className='form-control';
  inp.id=selectId;
  inp.setAttribute('list',datalistId);
  inp.value=val;
  inp.placeholder='Type or select...';
  sel.parentNode.insertBefore(dl,sel.nextSibling);
  sel.parentNode.replaceChild(inp,sel);
}

  const ap=parseFloat(document.getElementById('fb_ap'+fi)?.value)||0;
  const cut=parseFloat(document.getElementById('fb_cut'+fi)?.value)||0;
  const gm=d&&ap&&cut?calcGmSaree(d,ap,cut):0;
  const tot=gm*(order.qty||0);
  const el=document.getElementById('fb_gm'+fi);
  if(el) el.innerHTML=gm?`<span style="color:#38bdf8">Gm/Saree: ${gm.toFixed(6)}</span> | <span style="color:#4ade80">Total: ${tot.toFixed(2)}g</span>`:'';
}
function fbSave(orderNo1, orderNo){
  const n=parseInt(document.getElementById('fb_fc')?.value||2);
  const order=DB.orders.find(o=>o.order_no===orderNo)||{qty:0,type:'SINGLE'};
  const allRows=ywGetAllRows();
  const row=allRows.find(r=>r.order_no1===orderNo1)||{};
  const entry={order_no1:orderNo1,order_no:orderNo,design:order.design_no||'',colour:row.colour||'',saree:row.saree||'',type:order.type||'SINGLE',beam:order.beam1||order.beam||'',qty:order.qty||0,status:'PENDING'};
  for(let i=1;i<=n;i++){
    const yarn=document.getElementById('fb_y'+i)?.value||'';
    const d=parseFloat(document.getElementById('fb_d'+i)?.value)||0;
    const ap=parseFloat(document.getElementById('fb_ap'+i)?.value)||0;
    const cut=parseFloat(document.getElementById('fb_cut'+i)?.value)||0;
    const gm=d&&ap&&cut?calcGmSaree(d,ap,cut):0;
    entry['f'+i]={yarn,denier:d,avg_pick:ap,cut,gm_saree:gm,total_saree_gm:gm*(order.qty||0)};
  }
  const idx=DB.yarnWeight.findIndex(y=>y.order_no1===orderNo1);
  if(idx>=0) DB.yarnWeight[idx]=entry; else DB.yarnWeight.push(entry);
  // Auto PMS
  if(!DB.pms.find(p=>p.order_no1===orderNo1)){
    DB.pms.push({sno:DB.pms.length>0?Math.max(...DB.pms.map(p=>p.sno))+1:1,order_no1:orderNo1,order_no:orderNo,order_date:order.order_date||'',party:order.party||'',design:order.design_no||'',qty:order.qty||0,mc_no:'',mc_type:'RPT',status:'PENDING',rpt:40,matching_no:1,repeat_date:'',end_date:'',rpt_done:0});
  }
  closeModal(); showToast('✅ Feeder data saved!'); autoSync();
}

// ── Auto-load from Turso on page open ───────────────
window.addEventListener('load', function() {
  // Pull latest cloud data first
  pullAllFromTurso(true).then(function(loaded) {
    // If Turso was empty (first time ever), push current DB to cloud to seed it
    if (!loaded) {
      setTimeout(function() { autoSync(); }, 1500);
    }
  });
  // Auto-refresh every 20 seconds when tab is visible
  setInterval(function() {
    if (document.visibilityState === 'visible') pullAllFromTurso(true);
  }, 20000);
});
document.addEventListener('visibilitychange', function() {
  if (!document.hidden) pullAllFromTurso(true);
});
</script>
