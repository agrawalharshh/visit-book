<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiva Group Business Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --primary:#1a2744;
  --primary-light:#243560;
  --accent:#f59e0b;
  --accent2:#e11d48;
  --teal:#0ea5e9;
  --success:#10b981;
  --surface:#ffffff;
  --surface2:#f0f4f8;
  --border:#e2e8f0;
  --text:#1e293b;
  --muted:#64748b;
  --font-head:'Rajdhani',sans-serif;
  --font-body:'DM Sans',sans-serif;
  --radius:14px;
}
body{font-family:var(--font-body);background:var(--surface2);color:var(--text);min-height:100vh;}

/* ── LOGIN ── */
#loginScreen{position:fixed;inset:0;background:linear-gradient(135deg,#0d1829 0%,#1a2744 55%,#1e3a6e 100%);
  display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;}
.login-wrap{background:#fff;border-radius:24px;padding:44px 40px;width:400px;max-width:100%;
  box-shadow:0 24px 80px rgba(0,0,0,0.45);}
.login-brand{text-align:center;margin-bottom:32px;}
.login-icon{width:64px;height:64px;background:linear-gradient(135deg,var(--accent),#d97706);
  border-radius:16px;display:inline-flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:900;color:#fff;font-family:var(--font-head);margin-bottom:14px;
  box-shadow:0 8px 24px rgba(245,158,11,0.4);}
.login-brand h1{font-family:var(--font-head);font-size:24px;font-weight:800;color:var(--primary);}
.login-brand h1 span{color:var(--accent);}
.login-brand p{font-size:11px;color:var(--muted);letter-spacing:1.8px;text-transform:uppercase;margin-top:4px;}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;
  letter-spacing:0.8px;margin-bottom:6px;}
.form-input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;
  font-size:14px;font-family:var(--font-body);color:var(--text);transition:border-color 0.2s;outline:none;}
.form-input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,165,233,0.12);}
.form-group{margin-bottom:16px;}
.login-btn{width:100%;padding:13px;background:var(--primary);color:#fff;border:none;border-radius:10px;
  font-size:15px;font-weight:700;font-family:var(--font-body);cursor:pointer;
  transition:all 0.2s;margin-top:6px;letter-spacing:0.3px;}
.login-btn:hover{background:var(--primary-light);transform:translateY(-1px);box-shadow:0 6px 20px rgba(26,39,68,0.3);}
.login-err{color:#ef4444;font-size:12px;text-align:center;margin-top:10px;padding:8px;
  background:#fef2f2;border-radius:8px;display:none;}

/* ── TOP BAR ── */
.topbar{height:58px;background:var(--primary);display:flex;align-items:center;padding:0 24px;
  gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,0.3);}
.tb-brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
.tb-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),#d97706);
  border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:900;color:#fff;font-family:var(--font-head);flex-shrink:0;}
.tb-name{font-family:var(--font-head);font-size:17px;font-weight:800;color:#fff;line-height:1.1;}
.tb-name span{color:var(--accent);}
.tb-sub{font-size:9px;color:rgba(255,255,255,0.5);letter-spacing:2px;text-transform:uppercase;}
.tb-spacer{flex:1;}
.tb-badge{font-size:11px;color:rgba(255,255,255,0.7);padding:4px 10px;background:rgba(255,255,255,0.08);
  border-radius:20px;}
.tb-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.18);color:#fff;
  border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px;font-weight:600;
  transition:all 0.2s;font-family:var(--font-body);}
.tb-btn:hover{background:rgba(255,255,255,0.2);}

/* ── HUB CONTENT ── */
.hub{max-width:1200px;margin:0 auto;padding:40px 24px;}
.hub-welcome{margin-bottom:40px;}
.hub-welcome h2{font-family:var(--font-head);font-size:30px;font-weight:700;color:var(--primary);}
.hub-welcome h2 span{color:var(--accent);}
.hub-welcome p{color:var(--muted);margin-top:6px;font-size:14px;}
.hub-search{position:relative;max-width:380px;margin-bottom:40px;}
.hub-search input{width:100%;padding:11px 14px 11px 42px;border:1.5px solid var(--border);
  border-radius:12px;font-size:14px;font-family:var(--font-body);background:#fff;
  color:var(--text);outline:none;transition:border-color 0.2s;}
.hub-search input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,165,233,0.1);}
.hub-search .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:16px;color:var(--muted);}

.modules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;}
.mod-card{background:#fff;border-radius:var(--radius);padding:24px;cursor:pointer;
  border:1.5px solid var(--border);transition:all 0.22s;position:relative;overflow:hidden;}
.mod-card:hover{border-color:var(--accent);box-shadow:0 8px 28px rgba(0,0,0,0.12);transform:translateY(-3px);}
.mod-card.disabled{opacity:0.45;cursor:not-allowed;pointer-events:none;}
.mod-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--card-accent,var(--accent));border-radius:var(--radius) var(--radius) 0 0;}
.mod-icon{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:24px;margin-bottom:16px;
  background:var(--card-bg,#fef3c7);}
.mod-name{font-family:var(--font-head);font-size:18px;font-weight:700;color:var(--primary);
  margin-bottom:5px;}
.mod-desc{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:18px;}
.mod-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  color:var(--card-color,var(--primary));text-transform:uppercase;letter-spacing:0.8px;
  border:none;background:none;cursor:pointer;padding:0;font-family:var(--font-body);}
.mod-badge{position:absolute;top:16px;right:16px;font-size:10px;font-weight:700;
  padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.6px;}
.badge-live{background:#dcfce7;color:#16a34a;}
.badge-soon{background:#f1f5f9;color:#94a3b8;}

.section-title{font-family:var(--font-head);font-size:13px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px;margin-top:8px;}

/* ── USER PANEL DROPDOWN ── */
.user-dropdown{position:relative;}
.user-menu{position:absolute;right:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--border);
  border-radius:12px;padding:6px;min-width:220px;box-shadow:0 8px 32px rgba(0,0,0,0.15);
  display:none;z-index:200;}
.user-menu.open{display:block;}
.um-header{padding:12px 14px;border-bottom:1px solid var(--border);margin-bottom:6px;}
.um-name{font-weight:700;font-size:14px;}
.um-role{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;}
.um-item{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;
  cursor:pointer;font-size:13px;font-weight:500;transition:background 0.15s;}
.um-item:hover{background:var(--surface2);}
.um-item.danger{color:#ef4444;}
</style>
</head>
<body>

<!-- ════════════════ LOGIN ════════════════ -->
<div id="loginScreen">
  <div class="login-wrap">
    <div class="login-brand">
      <div class="login-icon">S</div>
      <h1>Shiva Group <span>Business Hub</span></h1>
      <p>Enterprise Management System</p>
    </div>
    <div class="form-group">
      <label class="form-label">User ID</label>
      <input class="form-input" id="lUser" placeholder="Enter your user ID" autocomplete="username"
        onkeydown="if(event.key==='Enter')document.getElementById('lPass').focus()">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-input" type="password" id="lPass" placeholder="Enter password"
        autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" onclick="doLogin()">🔐 Sign In</button>
    <div id="loginErr" class="login-err"></div>
  </div>
</div>

<!-- ════════════════ TOP BAR ════════════════ -->
<div class="topbar">
  <div class="tb-brand">
    <div class="tb-icon">S</div>
    <div>
      <div class="tb-name">Shiva Group <span>Business Hub</span></div>
      <div class="tb-sub">Enterprise Management System</div>
    </div>
  </div>
  <div class="tb-spacer"></div>
  <span class="tb-badge" id="tbTime"></span>
  <div class="user-dropdown">
    <button class="tb-btn" id="userBtn" onclick="toggleUserMenu()">👤 <span id="tbUserName">Guest</span> ▾</button>
    <div class="user-menu" id="userMenu">
      <div class="um-header">
        <div class="um-name" id="umName">—</div>
        <div class="um-role" id="umRole">—</div>
      </div>
      <div class="um-item" onclick="openModule('users')">⚙️ User Management</div>
      <div class="um-item" onclick="openModule('settings')">🔧 Settings</div>
      <div class="um-item danger" onclick="doLogout()">🔐 Logout</div>
    </div>
  </div>
</div>

<!-- ════════════════ HUB CONTENT ════════════════ -->
<div class="hub" id="hubContent" style="display:none">
  <div class="hub-welcome">
    <h2>Welcome, <span id="welcomeName">—</span> 👋</h2>
    <p>Select a business module to get started. You have access to <span id="accessCount">—</span> modules.</p>
  </div>

  <div class="hub-search">
    <span class="search-icon">🔍</span>
    <input type="text" placeholder="Search modules..." id="modSearch" oninput="filterModules(this.value)">
  </div>

  <div class="section-title">Business Modules</div>
  <div class="modules-grid" id="modulesGrid"></div>
</div>

<script>
// ════════════════════════════════════════════════════════
// USER SYSTEM
// ════════════════════════════════════════════════════════
var _user = null;

function hashPass(p){
  var h=0;
  for(var i=0;i<p.length;i++){h=((h<<5)-h)+p.charCodeAt(i);h|=0;}
  return 'h'+Math.abs(h).toString(36);
}

function getUsers(){
  try{var r=localStorage.getItem('_sg_users');if(r)return JSON.parse(r);}catch(e){}
  return [{id:'admin',pass:hashPass('admin123'),name:'Administrator',role:'admin',
    modules:['all'],dept:'Management',active:true}];
}
function saveUsers(u){localStorage.setItem('_sg_users',JSON.stringify(u));}

function doLogin(){
  var uid=(document.getElementById('lUser').value||'').trim().toLowerCase();
  var pass=document.getElementById('lPass').value||'';
  var err=document.getElementById('loginErr');
  var users=getUsers();
  var user=users.find(function(u){
    return u.id.toLowerCase()===uid && u.pass===hashPass(pass) && u.active!==false;
  });
  if(!user){
    err.textContent='❌ Invalid User ID or Password. Please try again.';
    err.style.display='block';
    return;
  }
  _user=user;
  localStorage.setItem('_sg_session',JSON.stringify({
    id:user.id,name:user.name,role:user.role,modules:user.modules,ts:Date.now()
  }));
  document.getElementById('loginScreen').style.display='none';
  showHub();
}

function checkSession(){
  try{
    var s=JSON.parse(localStorage.getItem('_sg_session')||'null');
    if(s&&s.ts&&(Date.now()-s.ts)<8*60*60*1000){
      var user=getUsers().find(function(u){return u.id===s.id&&u.active!==false;});
      if(user){_user=user;return true;}
    }
  }catch(e){}
  return false;
}

function doLogout(){
  localStorage.removeItem('_sg_session');
  location.reload();
}

function hasAccess(modId){
  if(!_user)return false;
  if(_user.role==='admin')return true;
  var m=_user.modules||[];
  return m.includes('all')||m.includes(modId);
}

function toggleUserMenu(){
  document.getElementById('userMenu').classList.toggle('open');
}
document.addEventListener('click',function(e){
  if(!e.target.closest('.user-dropdown'))
    document.getElementById('userMenu').classList.remove('open');
});

// ════════════════════════════════════════════════════════
// MODULE DEFINITIONS
// ════════════════════════════════════════════════════════
var MODULES = [
  {id:'erp', name:'Textile ERP', icon:'🏭',
   desc:'FMS orders, PMS job cards, yarn stock, purchase orders, production & invoicing.',
   color:'#1a2744', bg:'#e0e7ff', accent:'#4f46e5', url:'erp.html', live:true},
  {id:'visitbook', name:'Visit Book & CRM', icon:'📖',
   desc:'Client visits, active clients, follow-ups, area tracking, WhatsApp, sales costing.',
   color:'#0f766e', bg:'#ccfbf1', accent:'#0d9488', url:'salesmanager.html', live:true},
  {id:'products', name:'Product Database', icon:'📦',
   desc:'Product catalogue, supplier database, colour variants, MOQ, pricing and images.',
   color:'#b45309', bg:'#fef3c7', accent:'#d97706', url:'index.html', live:true},
  {id:'sales', name:'Online Sales Manager', icon:'🛒',
   desc:'Meesho & Flipkart costing, sales tracking, returns, claims and channel reports.',
   color:'#7c3aed', bg:'#ede9fe', accent:'#8b5cf6', url:'salesmanager.html', live:true},
  {id:'reports', name:'Reports & Analytics', icon:'📊',
   desc:'Order reports, PMS reports, stock reports, payment history and business summaries.',
   color:'#0e7490', bg:'#cffafe', accent:'#0891b2', url:'erp.html#reports', live:true},
  {id:'users', name:'User Management', icon:'⚙️',
   desc:'Manage users, roles, permissions, departments and module access rights.',
   color:'#1e293b', bg:'#f1f5f9', accent:'#475569', url:null, live:true, special:'users'},
  {id:'settings', name:'Settings', icon:'🔧',
   desc:'Suppliers, parties, agents, yarn data, beam master, Champion/Jari configuration.',
   color:'#374151', bg:'#f9fafb', accent:'#6b7280', url:'erp.html#settings', live:true, special:'settings-erp'},
];

// ════════════════════════════════════════════════════════
// HUB RENDERING
// ════════════════════════════════════════════════════════
function showHub(){
  document.getElementById('hubContent').style.display='block';
  document.getElementById('tbUserName').textContent=_user.name.split(' ')[0];
  document.getElementById('umName').textContent=_user.name;
  document.getElementById('umRole').textContent=_user.role;
  document.getElementById('welcomeName').textContent=_user.name.split(' ')[0];
  renderModules(MODULES);
  var accessible=MODULES.filter(function(m){return hasAccess(m.id);}).length;
  document.getElementById('accessCount').textContent=accessible;
}

function renderModules(mods){
  var grid=document.getElementById('modulesGrid');
  grid.innerHTML=mods.map(function(m){
    var canAccess=hasAccess(m.id);
    return '<div class="mod-card'+(canAccess?'':' disabled')+'" '
      +'style="--card-accent:'+m.accent+';--card-bg:'+m.bg+';--card-color:'+m.color+'"'
      +(canAccess&&(m.url||m.special)?'onclick="openModule(\''+m.id+'\')"':'')+' id="mc_'+m.id+'">'
      +'<div class="mod-badge badge-live">● Live</div>'
      +'<div class="mod-icon" style="background:'+m.bg+'">'+m.icon+'</div>'
      +'<div class="mod-name">'+m.name+'</div>'
      +'<div class="mod-desc">'+m.desc+'</div>'
      +(canAccess
        ?'<button class="mod-btn" style="color:'+m.color+'">Open Module →</button>'
        :'<span style="font-size:11px;color:#94a3b8">🔒 Access Restricted</span>')
      +'</div>';
  }).join('');
}

function filterModules(q){
  q=q.toLowerCase();
  var filtered=MODULES.filter(function(m){
    return !q||m.name.toLowerCase().includes(q)||m.desc.toLowerCase().includes(q);
  });
  renderModules(filtered);
}

function openModule(id){
  document.getElementById('userMenu').classList.remove('open');
  var mod=MODULES.find(function(m){return m.id===id;});
  if(id==='users'){showUserManagement();return;}
  if(!mod){return;}
  // Handle special modules
  if(mod.special==='settings-erp'){
    sessionStorage.setItem('_sg_session',JSON.stringify({
      id:_user.id,name:_user.name,role:_user.role,modules:_user.modules,ts:Date.now()
    }));
    window.location.href='erp.html';
    return;
  }
  if(!mod.url){return;}
  // Pass session to target module
  sessionStorage.setItem('_sg_session',JSON.stringify({
    id:_user.id,name:_user.name,role:_user.role,modules:_user.modules,ts:Date.now()
  }));
  window.location.href=mod.url;
}

// ════════════════════════════════════════════════════════
// USER MANAGEMENT (Full system)
// ════════════════════════════════════════════════════════
function showUserManagement(){
  if(_user.role!=='admin'){
    alert('⛔ Sirf Admin yeh section access kar sakta hai.');return;
  }
  document.getElementById('userMenu').classList.remove('open');
  var users=getUsers();
  var allMods=MODULES.map(function(m){return m.id;});

  var modal=document.createElement('div');
  modal.id='umModal';
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px;';
  modal.innerHTML='<div style="background:#fff;border-radius:20px;width:720px;max-width:100%;max-height:88vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,0.3)">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid #e2e8f0">'
    +'<h2 style="font-family:Rajdhani,sans-serif;font-size:20px;font-weight:800;color:#1a2744">⚙️ User Management</h2>'
    +'<button onclick="document.getElementById(\'umModal\').remove()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#64748b">✕</button>'
    +'</div>'
    +'<div style="padding:20px 24px;overflow-y:auto;flex:1">'
    +'<div style="display:flex;justify-content:flex-end;margin-bottom:16px">'
    +'<button onclick="showAddUserForm()" style="background:#1a2744;color:#fff;border:none;border-radius:9px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer">+ Add User</button>'
    +'</div>'
    +'<div id="userList">'+buildUserList(users)+'</div>'
    +'</div>'
    +'</div>';
  document.body.appendChild(modal);
  modal.addEventListener('click',function(e){if(e.target===modal)modal.remove();});
}

function buildUserList(users){
  var ROLE_COLORS={admin:'#4f46e5',operator:'#059669',viewer:'#d97706'};
  return users.map(function(u,i){
    return '<div style="display:flex;align-items:center;gap:14px;padding:14px 16px;background:#f8fafc;border-radius:12px;margin-bottom:8px;border:1px solid #e2e8f0">'
      +'<div style="width:42px;height:42px;background:#1a2744;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;flex-shrink:0">'+u.name.charAt(0).toUpperCase()+'</div>'
      +'<div style="flex:1">'
      +'<div style="font-weight:700;font-size:14px">'+u.name+'</div>'
      +'<div style="font-size:12px;color:#64748b">@'+u.id+' · '+u.dept+'</div>'
      +'</div>'
      +'<span style="background:'+(ROLE_COLORS[u.role]||'#64748b')+'22;color:'+(ROLE_COLORS[u.role]||'#64748b')+';border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;text-transform:uppercase">'+u.role+'</span>'
      +'<span style="background:'+(u.active!==false?'#dcfce7':'#fee2e2')+';color:'+(u.active!==false?'#16a34a':'#dc2626')+';border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700">'+(u.active!==false?'Active':'Disabled')+'</span>'
      +'<button onclick="showEditUser('+i+')" style="background:none;border:1px solid #e2e8f0;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px">✏️ Edit</button>'
      +(u.id!=='admin'?'<button onclick="deleteUser('+i+')" style="background:none;border:1px solid #fecaca;color:#ef4444;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px">🗑️</button>':'')
      +'</div>';
  }).join('');
}

function showAddUserForm(){
  var mods=MODULES.map(function(m){
    return '<label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer">'
      +'<input type="checkbox" name="nu_mod" value="'+m.id+'" checked> '+m.icon+' '+m.name+'</label>';
  }).join('');
  var content=document.createElement('div');
  content.id='addUserForm';
  content.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9100;display:flex;align-items:center;justify-content:center;padding:20px;';
  content.innerHTML='<div style="background:#fff;border-radius:20px;width:560px;max-width:100%;max-height:88vh;overflow-y:auto;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,0.35)">'
    +'<h3 style="font-family:Rajdhani,sans-serif;font-size:18px;font-weight:800;margin-bottom:20px">+ New User</h3>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">'
    +'<div><label style="display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:5px">Full Name *</label><input id="nu_name" style="width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px" placeholder="Ravi Sharma"></div>'
    +'<div><label style="display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:5px">User ID *</label><input id="nu_id" style="width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px" placeholder="ravi.sharma"></div>'
    +'<div><label style="display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:5px">Password *</label><input type="password" id="nu_pass" style="width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px"></div>'
    +'<div><label style="display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:5px">Department</label><input id="nu_dept" style="width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px" placeholder="Production"></div>'
    +'<div><label style="display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:5px">Role</label><select id="nu_role" style="width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px"><option value="admin">Admin</option><option value="operator" selected>Operator</option><option value="viewer">Viewer</option></select></div>'
    +'</div>'
    +'<div style="margin-bottom:16px"><label style="display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:10px">Module Access</label>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#f8fafc;padding:12px;border-radius:8px">'+mods+'</div></div>'
    +'<div style="display:flex;gap:10px">'
    +'<button onclick="saveNewUser()" style="flex:1;background:#1a2744;color:#fff;border:none;border-radius:9px;padding:11px;font-size:14px;font-weight:700;cursor:pointer">Save User</button>'
    +'<button onclick="document.getElementById(\'addUserForm\').remove()" style="padding:11px 20px;background:none;border:1.5px solid #e2e8f0;border-radius:9px;cursor:pointer;font-size:14px">Cancel</button>'
    +'</div></div>';
  document.body.appendChild(content);
}

function saveNewUser(){
  var name=(document.getElementById('nu_name')?.value||'').trim();
  var uid=(document.getElementById('nu_id')?.value||'').trim().toLowerCase().replace(/\s+/g,'.');
  var pass=document.getElementById('nu_pass')?.value||'';
  var dept=(document.getElementById('nu_dept')?.value||'').trim();
  var role=document.getElementById('nu_role')?.value||'operator';
  var checkedMods=[...document.querySelectorAll('input[name="nu_mod"]:checked')].map(function(c){return c.value;});
  if(!name||!uid||!pass){alert('⚠️ Name, User ID aur Password zaroori hain!');return;}
  var users=getUsers();
  if(users.find(function(u){return u.id===uid;})){alert('⚠️ User ID already exists!');return;}
  users.push({id:uid,pass:hashPass(pass),name:name,role:role,dept:dept||'General',
    modules:checkedMods.length?checkedMods:['all'],active:true});
  saveUsers(users);
  document.getElementById('addUserForm')?.remove();
  document.getElementById('userList').innerHTML=buildUserList(users);
  alert('✅ User '+name+' added successfully!');
}

function showEditUser(i){
  var users=getUsers();
  var u=users[i];
  var mods=MODULES.map(function(m){
    var checked=u.modules&&(u.modules.includes('all')||u.modules.includes(m.id));
    return '<label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer">'
      +'<input type="checkbox" name="eu_mod" value="'+m.id+'"'+(checked?' checked':'')+'>'+m.icon+' '+m.name+'</label>';
  }).join('');
  var form=document.createElement('div');
  form.id='editUserForm';
  form.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9100;display:flex;align-items:center;justify-content:center;padding:20px;';
  form.innerHTML='<div style="background:#fff;border-radius:20px;width:560px;max-width:100%;max-height:88vh;overflow-y:auto;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,0.35)">'
    +'<h3 style="font-family:Rajdhani,sans-serif;font-size:18px;font-weight:800;margin-bottom:20px">✏️ Edit: '+u.name+'</h3>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">'
    +'<div><label style="display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:5px">Full Name</label><input id="eu_name" value="'+u.name+'" style="width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px"></div>'
    +'<div><label style="display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:5px">New Password (blank=keep)</label><input type="password" id="eu_pass" style="width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px" placeholder="Leave blank"></div>'
    +'<div><label style="display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:5px">Department</label><input id="eu_dept" value="'+(u.dept||'')+'" style="width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px"></div>'
    +'<div><label style="display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:5px">Role</label><select id="eu_role" style="width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px"><option value="admin"'+(u.role==='admin'?' selected':'')+'>Admin</option><option value="operator"'+(u.role==='operator'?' selected':'')+'>Operator</option><option value="viewer"'+(u.role==='viewer'?' selected':'')+'>Viewer</option></select></div>'
    +'<div><label style="display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:5px">Status</label><select id="eu_active" style="width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px"><option value="1"'+(u.active!==false?' selected':'')+'>Active</option><option value="0"'+(u.active===false?' selected':'')+'>Disabled</option></select></div>'
    +'</div>'
    +'<div style="margin-bottom:16px"><label style="display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:10px">Module Access</label>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#f8fafc;padding:12px;border-radius:8px">'+mods+'</div></div>'
    +'<input type="hidden" id="eu_idx" value="'+i+'">'
    +'<div style="display:flex;gap:10px">'
    +'<button onclick="saveEditUser()" style="flex:1;background:#1a2744;color:#fff;border:none;border-radius:9px;padding:11px;font-size:14px;font-weight:700;cursor:pointer">Update User</button>'
    +'<button onclick="document.getElementById(\'editUserForm\').remove()" style="padding:11px 20px;background:none;border:1.5px solid #e2e8f0;border-radius:9px;cursor:pointer;font-size:14px">Cancel</button>'
    +'</div></div>';
  document.body.appendChild(form);
}

function saveEditUser(){
  var i=parseInt(document.getElementById('eu_idx')?.value||0);
  var users=getUsers();
  var name=(document.getElementById('eu_name')?.value||'').trim();
  var pass=document.getElementById('eu_pass')?.value||'';
  var dept=(document.getElementById('eu_dept')?.value||'').trim();
  var role=document.getElementById('eu_role')?.value||'operator';
  var active=document.getElementById('eu_active')?.value==='1';
  var checkedMods=[...document.querySelectorAll('input[name="eu_mod"]:checked')].map(function(c){return c.value;});
  if(name) users[i].name=name;
  if(pass) users[i].pass=hashPass(pass);
  users[i].dept=dept||users[i].dept;
  users[i].role=role; users[i].active=active;
  users[i].modules=checkedMods.length?checkedMods:['all'];
  saveUsers(users);
  document.getElementById('editUserForm')?.remove();
  document.getElementById('userList').innerHTML=buildUserList(users);
  alert('✅ User updated!');
}

function deleteUser(i){
  var users=getUsers();
  if(users[i].id==='admin'){alert('⚠️ Admin user delete nahi ho sakta!');return;}
  if(!confirm('Delete user "'+users[i].name+'"?'))return;
  users.splice(i,1);
  saveUsers(users);
  document.getElementById('userList').innerHTML=buildUserList(users);
}
