services:
  - type: web
    name: visitbook-crm
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/visitbook.sqlite
      - key: WA_WEBHOOK_VERIFY_TOKEN
        sync: false
    disk:
      name: visitbook-data
      mountPath: /var/data
      sizeGB: 1
